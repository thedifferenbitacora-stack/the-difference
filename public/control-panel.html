cat > public/control-panel.html << 'EOF'
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>️ THE DIFFERENCE | Control Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #050505 0%, #0a0a1a 100%);
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container { max-width: 900px; width: 100%; }

    .header {
      text-align: center;
      margin-bottom: 50px;
      border-bottom: 2px solid #ff3e96;
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 3rem;
      color: #ff3e96;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 0 15px rgba(255, 62, 150, 0.4);
      margin-bottom: 10px;
    }

    .header p { color: #7c3aed; font-size: 1.1rem; letter-spacing: 0.05em; }

    .status-card {
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid #333;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      margin-bottom: 40px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .status-card.online {
      border-color: #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
    }

    .status-card.online::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #10b981, #059669);
    }

    .status-card.offline { border-color: #ef4444; }

    .status-card.offline::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #ef4444, #dc2626);
    }

    .status-indicator {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .online .status-indicator {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    .offline .status-indicator { background: #ef4444; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-text { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .control-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 25px;
      color: white;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .control-btn .icon { font-size: 2rem; }

    .btn-start { border-color: #10b981; color: #10b981; }
    .btn-start:hover { background: #10b981; color: #000; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }

    .btn-stop { border-color: #ef4444; color: #ef4444; }
    .btn-stop:hover { background: #ef4444; color: #000; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

    .btn-backup { border-color: #f59e0b; color: #f59e0b; }
    .btn-backup:hover { background: #f59e0b; color: #000; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }

    .links-section {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .nav-link {
      padding: 12px 25px;
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid #7c3aed;
      border-radius: 8px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s;
    }

    .nav-link:hover {
      background: #7c3aed;
      color: white;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
    }

    .console-box {
      background: #000;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      height: 200px;
      overflow-y: auto;
      color: #6b7280;
    }

    .console-box::-webkit-scrollbar { width: 8px; }
    .console-box::-webkit-scrollbar-track { background: #111; }
    .console-box::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .log-entry { margin-bottom: 8px; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; }
    .log-time { color: #4b5563; margin-right: 10px; }
    .log-success { color: #10b981; }
    .log-error { color: #ef4444; }
    .log-info { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>️ THE DIFFERENCE</h1>
      <p>Panel de Control Independiente</p>
    </div>

    <div id="statusCard" class="status-card offline">
      <div class="status-text">
        <span class="status-indicator"></span>
        <span id="statusText">SISTEMA DETENIDO</span>
      </div>
    </div>

    <div class="controls-grid">
      <button class="control-btn btn-start" onclick="startServer()">
        <span class="icon">▶</span> INICIAR SERVIDOR
      </button>
      <button class="control-btn btn-stop" onclick="stopServer()">
        <span class="icon">⏹</span> DETENER SERVIDOR
      </button>
      <button class="control-btn btn-backup" onclick="runBackup()">
        <span class="icon">💾</span> EJECUTAR BACKUP
      </button>
    </div>

    <div class="links-section">
      <a href="http://localhost:4321" target="_blank" class="nav-link">🌐 SITIO</a>
      <a href="http://localhost:4321/texvn" target="_blank" class="nav-link">📓 TEXVN</a>
      <a href="http://localhost:4321/menu" target="_blank" class="nav-link">📋 MENÚ</a>
    </div>

    <div class="console-box" id="consoleBox">
      <div class="log-entry"><span class="log-time">[SISTEMA]</span> Panel inicializado. Esperando comandos...</div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    
    function log(msg, type = 'info') {
      const box = document.getElementById('consoleBox');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-entry log-${type}`;
      div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
      box.insertBefore(div, box.firstChild);
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${API}/status`);
        const data = await res.json();
        const card = document.getElementById('statusCard');
        const text = document.getElementById('statusText');
        
        if (data.running) {
          card.className = 'status-card online';
          text.innerText = 'SISTEMA ACTIVO (Puerto 4321)';
        } else {
          card.className = 'status-card offline';
          text.innerText = 'SISTEMA DETENIDO';
        }
      } catch (e) {}
    }

    async function startServer() {
      log('Iniciando servidor Astro...', 'info');
      try {
        const res = await fetch(`${API}/start`, { method: 'POST' });
        const data = await res.json();
        log(data.message, data.success ? 'success' : 'error');
        setTimeout(checkStatus, 4000);
      } catch (e) { log('Error de conexión', 'error'); }
    }

    async function stopServer() {
      log('Deteniendo servidor...', 'info');
      try {
        const res = await fetch(`${API}/stop`, { method: 'POST' });
        const data = await res.json();
        log(data.message, data.success ? 'success' : 'error');
        setTimeout(checkStatus, 1000);
      } catch (e) { log('Error de conexión', 'error'); }
    }

    async function runBackup() {
      log('Ejecutando backup consciente...', 'info');
      try {
        const res = await fetch(`${API}/backup`, { method: 'POST' });
        const data = await res.json();
        log(data.message, data.success ? 'success' : 'error');
      } catch (e) { log('Error de conexión', 'error'); }
    }

    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
EOF
